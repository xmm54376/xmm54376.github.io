<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <style>
        /* 基于 NexT 主题的简化样式 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f7f9;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
            border-bottom: 1px solid #eaecef;
        }
        .header h1 {
            font-size: 2.5em;
            margin: 0;
            color: #2c3e50;
        }
        .header p {
            color: #666;
            font-size: 1.1em;
            margin-top: 10px;
        }
        .post {
            background: white;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .post h2 {
            color: #2c3e50;
            margin-top: 0;
        }
        .post-meta {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .post-content {
            line-height: 1.8;
        }
        .footer {
            text-align: center;
            color: #999;
            padding: 20px 0;
            border-top: 1px solid #eaecef;
            margin-top: 40px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            .post {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>我的个人博客</h1>
            <p>分享技术与生活</p>
        </div>
        
        <div class="post">
            <h2>欢迎来到我的博客</h2>
            <div class="post-meta">发布于 2026年2月3日</div>
            <div class="post-content">
                <p>这是我的第一个博客文章！</p>
                <p>这个博客基于 <strong>NexT 主题</strong>，这是一个拥有 15,000+ GitHub stars 的高质量开源博客主题。</p>
                <p>感谢你的访问！</p>
            </div>
        </div>
        
        <div class="post">
            <h2>关于我</h2>
            <div class="post-meta">发布于 2026年2月3日</div>
            <div class="post-content">
                <p>我是一个热爱技术的开发者，喜欢分享学习心得和实践经验。</p>
                <p>希望这个博客能对你有所帮助！</p>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 我的个人博客 | Powered by NexT Theme</p>
        </div>
    </div>
</body>
</html>
